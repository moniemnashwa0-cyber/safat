<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخصوصية | صفوة</title><style>body{margin:auto;max-width:760px;padding:40px 24px;font:16px/2 "Tajawal","Segoe UI",sans-serif;color:#1c2b36}h1{color:#12314f}a{color:#1f4e8c}</style></head><body><h1>سياسة الخصوصية</h1><p>نستخدم بيانات الاسم ووسائل التواصل والعنوان التي تدخلها لإدارة طلبك والتواصل معك بشأنه فقط.</p><p>لا يجمع هذا الموقع أرقام البطاقات أو رموز CVV أو رموز OTP، ولا يطلبها لإتمام طلب الساعة.</p><p>يُخزن الطلب مؤقتًا أثناء تشغيل الخدمة، وقد تُحذف البيانات عند إعادة تشغيل الخادم.</p><p><a href="index.html">العودة للرئيسية</a></p></body></html>
