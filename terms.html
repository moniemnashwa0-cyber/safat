<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الشروط والأحكام | صفوة</title><style>body{margin:auto;max-width:760px;padding:40px 24px;font:16px/2 "Tajawal","Segoe UI",sans-serif;color:#1c2b36}h1{color:#12314f}a{color:#1f4e8c}</style></head><body><h1>الشروط والأحكام</h1><p>هذا الموقع واجهة تجريبية لاستقبال طلبات الساعات وإدارة بيانات التوصيل.</p><p>إرسال النموذج لا يعني تأكيد التسليم النهائي؛ تتم مراجعة الطلب وقد يتواصل معك الفريق لتأكيد التفاصيل.</p><p>يجب إدخال بيانات صحيحة يمكن استخدامها للتواصل والتوصيل.</p><p><a href="index.html">العودة للرئيسية</a></p></body></html>
