<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track order | Safwa</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7fafc;color:#1c2b36;font-family:"Tajawal","Segoe UI",sans-serif}
    main{width:min(100%,500px);background:#fff;border:1px solid #e5e9eb;border-radius:12px;padding:36px;box-shadow:0 14px 40px #12314f18}h1{color:#12314f}p{color:#5c6b74;line-height:1.8}label{display:block;margin:22px 0 7px;font-weight:700}input{width:100%;padding:13px;border:1px solid #cfd7dc;border-radius:6px;font:inherit;box-sizing:border-box}button,a{display:inline-block;margin-top:18px;padding:12px 20px;border:0;border-radius:6px;background:#12314f;color:#fff;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}#result{min-height:24px;margin-top:18px;font-weight:700}.error{color:#b33}.success{color:#137a3d}
  </style>
</head>
<body>
  <main>
    <h1>Track your order</h1>
    <p>Enter your order number to check its status.</p>
    <label for="orderId">Order number</label>
    <input id="orderId" inputmode="numeric" autocomplete="off">
    <button id="trackBtn" type="button">Check status</button>
    <div id="result" aria-live="polite"></div>
    <a href="index.en.html">Back to home</a>
  </main>
  <script>
    const orderInput = document.getElementById('orderId');
    const result = document.getElementById('result');
    orderInput.value = new URLSearchParams(location.search).get('order') || '';
    document.getElementById('trackBtn').addEventListener('click', async () => {
      const id = orderInput.value.trim();
      if (!/^\d+$/.test(id)) { result.className = 'error'; result.textContent = 'Enter a valid order number.'; return; }
      result.className = ''; result.textContent = 'Checking...';
      try {
        const response = await fetch('/api/status/' + encodeURIComponent(id));
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error();
        const labels = { pending: 'Under review', approved: 'Approved', rejected: 'Rejected' };
        result.className = data.status === 'approved' ? 'success' : data.status === 'rejected' ? 'error' : '';
        result.textContent = 'Order status: ' + (labels[data.status] || data.status);
      } catch (error) { result.className = 'error'; result.textContent = 'Order not found.'; }
    });
  </script>
</body>
</html>
