<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order received | Safwa</title>
  <style>
    :root{--navy:#12314f;--ink:#1c2b36;--muted:#5c6b74;--line:#e5e9eb}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f7fafc,#fff);color:var(--ink);font-family:"Tajawal","Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
    .card{width:min(100%,520px);background:#fff;border:1px solid var(--line);border-radius:12px;padding:44px 32px;text-align:center;box-shadow:0 14px 40px rgba(18,49,79,.1)}
    .mark{width:68px;height:68px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:#dff3e6;color:#137a3d;font-size:36px;font-weight:700}
    h1{margin:0 0 12px;color:var(--navy);font-size:28px} p{margin:0 auto 28px;max-width:400px;color:var(--muted);line-height:1.8}
    a{display:inline-block;padding:12px 24px;border-radius:6px;background:var(--navy);color:#fff;text-decoration:none;font-weight:700} a:hover{background:#0c2438}
  </style>
</head>
<body>
  <main class="card" aria-labelledby="title">
    <div class="mark" aria-hidden="true">✓</div>
    <h1 id="title">Your order was received</h1>
    <p>Thank you. Your delivery details were submitted successfully. Our team will contact you when the order status is updated.</p>
    <p>Your order number: <strong id="orderId">-</strong></p>
    <a href="track-order.en.html" id="trackLink">Track order status</a>
    <a href="index.en.html">Back to home</a>
  </main>
  <script>const id=sessionStorage.getItem('safwa_order_id')||'-';document.getElementById('orderId').textContent=id;document.getElementById('trackLink').href='track-order.en.html?order='+encodeURIComponent(id);</script>
</body>
</html>
