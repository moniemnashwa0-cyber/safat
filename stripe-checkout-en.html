<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment</title>
<script src="https://js.stripe.com/v3/"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;900&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #FFFFFF;
    --card-border: #E5E7EE;
    --accent: #A11E1E;
    --accent-soft: rgba(161,30,30,0.08);
    --text: #1B1F2A;
    --muted: #7A8194;
    --error: #D14343;
    --success: #2F9E6B;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg);
    font-family:'Inter', sans-serif; color:var(--text);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:400px; background:#fff;
    border:1px solid var(--card-border); border-radius:20px;
    padding:36px 30px 30px; position:relative; overflow:hidden;
    box-shadow: 0 8px 30px rgba(20,20,30,0.06);
  }
  .card::before{
    content:""; position:absolute; top:0; right:0; left:0; height:3px;
    background: linear-gradient(90deg, var(--accent), transparent 70%);
  }
  .icon-pay{
    width:52px; height:52px; border-radius:14px;
    background: var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 22px;
  }
  h1{ font-family:'Poppins', sans-serif; font-weight:900; font-size:22px; margin:0 0 8px; }
  p.sub{ color:var(--muted); font-size:14px; line-height:1.7; margin:0 0 24px; }

  label{ display:block; font-size:13px; font-weight:600; margin-bottom:8px; }

  #card-element{
    padding: 13px 14px;
    border: 1.5px solid var(--card-border);
    border-radius: 12px;
    background: #FAFAFC;
    margin-bottom: 6px;
  }
  #card-element.StripeElement--focus{ border-color: var(--accent); }
  #card-element.StripeElement--invalid{ border-color: var(--error); }

  #card-errors{
    color: var(--error);
    font-size: 13px;
    min-height: 18px;
    margin: 8px 0 18px;
  }

  button.pay{
    width:100%; padding:14px; background:var(--accent); color:#fff;
    font-weight:700; font-size:15.5px; font-family:inherit;
    border:none; border-radius:12px; cursor:pointer;
    transition: filter .15s ease, opacity .15s ease;
  }
  button.pay:disabled{ opacity:.5; cursor:not-allowed; }
  button.pay:not(:disabled):hover{ filter: brightness(1.08); }

  .note{
    display:flex; gap:8px; align-items:flex-start; margin-top:18px;
    font-size:12px; color:var(--muted); line-height:1.6;
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon-pay">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <rect x="2.5" y="5" width="19" height="14" rx="2.2" stroke="#A11E1E" stroke-width="1.8"/>
      <path d="M2.5 9.5h19" stroke="#A11E1E" stroke-width="1.8"/>
      <path d="M6 15h4" stroke="#A11E1E" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </div>

  <h1>Complete payment</h1>
  <p class="sub">Your card details are encrypted and sent directly to Stripe — they never touch our server.</p>

  <form id="payment-form">
    <label>Card details</label>
    <div id="card-element"></div>
    <div id="card-errors" role="alert"></div>
    <button type="submit" class="pay" id="submitBtn">Pay now</button>
  </form>

  <div class="note">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex-shrink:0; margin-top:2px;">
      <path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-4z" stroke="#7A8194" stroke-width="1.5"/>
    </svg>
    <span>Secure, PCI-DSS compliant processing via Stripe.</span>
  </div>
</div>

<script>
  // ⚠️ Replace this with your real publishable key from the Stripe Dashboard (starts with pk_)
  const stripe = Stripe('pk_test_YOUR_PUBLISHABLE_KEY');
  const elements = stripe.elements();

  const cardElement = elements.create('card', {
    style: {
      base: {
        fontFamily: "'Inter', sans-serif",
        fontSize: '15px',
        color: '#1B1F2A',
        '::placeholder': { color: '#7A8194' }
      }
    }
  });
  cardElement.mount('#card-element');

  cardElement.on('change', (event) => {
    document.getElementById('card-errors').textContent = event.error ? event.error.message : '';
  });

  const form = document.getElementById('payment-form');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Processing...';

    // This step must happen through your backend:
    // 1) Your backend creates a PaymentIntent via the Stripe API and returns client_secret
    // 2) Here we confirm the payment using that client_secret
    //
    // Backend example (Node.js):
    //   const paymentIntent = await stripe.paymentIntents.create({
    //     amount: 5000, // in cents
    //     currency: 'usd'
    //   });
    //   res.json({ clientSecret: paymentIntent.client_secret });

    try {
      const res = await fetch('/create-payment-intent', { method: 'POST' });
      const { clientSecret } = await res.json();

      const result = await stripe.confirmCardPayment(clientSecret, {
        payment_method: { card: cardElement }
      });

      if (result.error) {
        document.getElementById('card-errors').textContent = result.error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Pay now';
      } else if (result.paymentIntent.status === 'succeeded') {
        window.location.href = 'success-en.html';
      }
    } catch (err) {
      document.getElementById('card-errors').textContent = 'Something went wrong, please try again';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Pay now';
    }
  });
</script>

</body>
</html>
