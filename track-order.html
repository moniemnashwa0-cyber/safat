<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تتبع الطلب | صفوة</title><style>:root{--navy:#12314f;--gold:#f4c26b;--ink:#1c2b36;--muted:#5c6b74}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f7fafc,#fff);font-family:"Tajawal","Segoe UI",sans-serif;color:var(--ink)}main{width:min(100%,500px);background:#fff;border:1px solid #e5e9eb;border-radius:12px;padding:36px;box-shadow:0 14px 40px #12314f18}h1{margin:0 0 10px;color:var(--navy)}p{color:var(--muted);line-height:1.8}label{display:block;margin:22px 0 7px;font-weight:700}input{width:100%;padding:13px;border:1px solid #cfd7dc;border-radius:6px;font:inherit}button,a{display:inline-block;margin-top:18px;padding:12px 20px;border:0;border-radius:6px;background:var(--navy);color:#fff;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}#result{min-height:24px;margin-top:18px;font-weight:700}.error{color:#b33}.success{color:#137a3d}</style></head>
<body><main><h1>تتبع طلبك</h1><p>أدخل رقم الطلب الذي ظهر لك بعد إرسال نموذج التوصيل لمعرفة حالته.</p><label for="orderId">رقم الطلب</label><input id="orderId" inputmode="numeric" autocomplete="off"><button id="trackBtn">عرض الحالة</button><div id="result" aria-live="polite"></div><a href="index.html">العودة للرئيسية</a></main><script>const result=document.getElementById('result');document.getElementById('trackBtn').addEventListener('click',async()=>{const id=document.getElementById('orderId').value.trim();if(!/^\d+$/.test(id)){result.className='error';result.textContent='أدخل رقم طلب صحيحًا.';return}result.className='';result.textContent='جارٍ البحث...';try{const res=await fetch('/api/status/'+encodeURIComponent(id));const data=await res.json();if(!res.ok||!data.ok)throw new Error();const labels={pending:'قيد المراجعة',approved:'تمت الموافقة',rejected:'مرفوض'};result.className=data.status==='approved'?'success':data.status==='rejected'?'error':'';result.textContent='حالة الطلب: '+(labels[data.status]||data.status)}catch(error){result.className='error';result.textContent='لم يتم العثور على هذا الطلب.'}});</script></body></html>
