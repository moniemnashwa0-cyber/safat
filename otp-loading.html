<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جاري التحقق</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap');

  :root{
    --bg: #FFFFFF;
    --card: #FFFFFF;
    --card-border: #E5E7EE;
    --accent: #A11E1E;
    --muted: #7A8194;
    --text: #1B1F2A;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    color: var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }

  .spinner{
    width: 48px; height: 48px;
    border: 3px solid var(--card-border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="spinner"></div>

<script>
  // هذه الصفحة تُستخدم كخطوة انتقالية بعد إدخال الكود في صفحة otp-verify.html
  // اربطها بالباك اند الحقيقي بدل المحاكاة اللي تحت:

  // مثال ربط حقيقي:
  // async function verifyOtp(code) {
  //   const res = await fetch('/api/verify-otp', {
  //     method: 'POST',
  //     headers: { 'Content-Type': 'application/json' },
  //     body: JSON.stringify({ code })
  //   });
  //   const data = await res.json();
  //   return data.valid === true;
  // }

  async function verifyOtp(code) {
    await new Promise(r => setTimeout(r, 1200)); // محاكاة وقت استجابة السيرفر
    return code === "123456"; // كود تجريبي فقط
  }

  (async () => {
    // الكود المُدخل يُمرَّر من الصفحة السابقة عبر sessionStorage أو query string
    const code = sessionStorage.getItem('otp_code') || new URLSearchParams(location.search).get('code') || '';

    const isValid = await verifyOtp(code);

    if (isValid) {
      // انتقل لصفحة النجاح / الصفحة التالية في تدفقك الحقيقي
      window.location.href = 'success.html';
    } else {
      // ارجع لصفحة إدخال الكود مع علامة الخطأ
      window.location.href = 'otp-verify.html?error=1';
    }
  })();
</script>

</body>
</html>
