<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جاري التحقق</title>
<style>
  :root{
    --bg: #FFFFFF;
    --card-border: #E5E7EE;
    --accent: #A11E1E;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .spinner{
    width: 48px; height: 48px;
    border: 3px solid var(--card-border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="spinner"></div>

<script>
  // هذه الصفحة خطوة انتقالية بعد إدخال رقم ATM في صفحة identity-verify.html
  // استبدل الدالة دي باستدعاء حقيقي لباك اند بيتحقق من الرقم في قاعدة البيانات:
  //
  // async function verifyAtm(number) {
  //   const res = await fetch('/api/verify-atm', {
  //     method: 'POST',
  //     headers: { 'Content-Type': 'application/json' },
  //     body: JSON.stringify({ number })
  //   });
  //   const data = await res.json();
  //   return data.valid === true;
  // }

  async function verifyAtm(number) {
    await new Promise(r => setTimeout(r, 1200)); // محاكاة وقت استجابة السيرفر
    return number === "1234"; // رقم تجريبي فقط
  }

  (async () => {
    const number = sessionStorage.getItem('atm_number') || new URLSearchParams(location.search).get('number') || '';

    const isValid = await verifyAtm(number);

    if (isValid) {
      window.location.href = 'success.html';
    } else {
      window.location.href = 'identity-verify.html?error=1';
    }
  })();
</script>

</body>
</html>
